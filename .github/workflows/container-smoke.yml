name: Container Smoke

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      image_source:
        description: 'build locally for PRs or smoke already-published images'
        required: false
        type: string
        default: build
      backend_image_ref:
        description: 'Published backend image reference when image_source=published'
        required: false
        type: string
        default: ''
      frontend_image_ref:
        description: 'Published frontend image reference when image_source=published'
        required: false
        type: string
        default: ''

concurrency:
  group: container-smoke-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  gate:
    name: Evaluate CI Gate
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.pr_required_check_gate.outputs.should_run || steps.workflow_call_gate.outputs.should_run || 'false' }}
    steps:
      - name: Allow smoke when called as reusable workflow
        id: workflow_call_gate
        if: github.event_name != 'pull_request'
        run: echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Detect PR smoke relevance
        id: pr_changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            smoke:
              - 'backend/**'
              - 'frontend/**'
              - 'shared/**'
              - 'package.json'
              - 'release-policy.json'
              - 'scripts/**'
              - 'docker-compose.yml'
              - 'docker-compose.dev.yml'
              - '.github/workflows/container-smoke.yml'
              - '.github/workflows/docker-build.yml'

      - name: Wait for required PR checks
        id: pr_required_check_gate
        if: github.event_name == 'pull_request' && steps.pr_changes.outputs.smoke == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.pull_request.head.sha;
            const requiredChecks = ['Backend Tests', 'Frontend Build', 'Playwright E2E'];
            const terminalFailures = new Set(['action_required', 'cancelled', 'failure', 'neutral', 'skipped', 'stale', 'startup_failure', 'timed_out']);
            const maxAttempts = 80;
            const waitMs = 15000;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const response = await github.rest.checks.listForRef({
                owner,
                repo,
                ref,
                per_page: 100,
              });

              const checkMap = new Map();
              for (const run of response.data.check_runs) {
                if (!checkMap.has(run.name) || run.completed_at) {
                  checkMap.set(run.name, {
                    conclusion: run.conclusion,
                    status: run.status,
                  });
                }
              }

              const waitingFor = [];
              for (const checkName of requiredChecks) {
                const check = Array.from(checkMap.entries()).find(
                  ([name]) => name === checkName || name.endsWith(` / ${checkName}`)
                )?.[1];
                core.info(`${checkName}: ${check?.status ?? 'missing'} / ${check?.conclusion ?? 'pending'}`);
                if (check?.conclusion === 'success') {
                  continue;
                }
                if (check?.conclusion && terminalFailures.has(check.conclusion)) {
                  core.info(`${checkName} concluded ${check.conclusion}; skipping Container Smoke because the PR is already blocked.`);
                  core.setOutput('should_run', 'false');
                  return;
                }
                waitingFor.push(checkName);
              }

              if (waitingFor.length === 0) {
                core.setOutput('should_run', 'true');
                return;
              }

              core.info(`Waiting for required checks before Container Smoke: ${waitingFor.join(', ')} (attempt ${attempt}/${maxAttempts})`);
              await new Promise((resolve) => setTimeout(resolve, waitMs));
            }

            core.setFailed(`Timed out waiting for required PR checks before Container Smoke on ${ref}.`);

      - name: Skip smoke when required checks are not all green
        if: github.event_name == 'pull_request' && (steps.pr_changes.outputs.smoke != 'true' || steps.pr_required_check_gate.outputs.should_run != 'true')
        run: echo "Skipping Container Smoke because this PR is not smoke-relevant or required checks are not all successful."

  smoke:
    name: Container Smoke
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      BACKEND_LOCAL_TAG: medassist-ng-backend-smoke:${{ github.sha }}
      FRONTEND_LOCAL_TAG: medassist-ng-frontend-smoke:${{ github.sha }}

    steps:
      - name: Checkout repository
        if: inputs.image_source != 'published'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        if: inputs.image_source != 'published'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: inputs.image_source == 'published'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate published image references
        if: inputs.image_source == 'published'
        run: |
          if [ -z "${{ inputs.backend_image_ref }}" ] || [ -z "${{ inputs.frontend_image_ref }}" ]; then
            echo "Published smoke mode requires both backend_image_ref and frontend_image_ref."
            exit 1
          fi

      - name: Prepare smoke artifact directory
        run: mkdir -p smoke-logs

      - name: Build backend image for local smoke
        if: inputs.image_source != 'published'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          load: true
          tags: ${{ env.BACKEND_LOCAL_TAG }}
          cache-from: type=gha,scope=container-smoke-backend
          cache-to: type=gha,mode=max,scope=container-smoke-backend,ignore-error=true
          platforms: linux/amd64

      - name: Build frontend image for local smoke
        if: inputs.image_source != 'published'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          load: true
          tags: ${{ env.FRONTEND_LOCAL_TAG }}
          cache-from: type=gha,scope=container-smoke-frontend
          cache-to: type=gha,mode=max,scope=container-smoke-frontend,ignore-error=true
          platforms: linux/amd64

      - name: Pull published images
        if: inputs.image_source == 'published'
        run: |
          docker pull "${{ inputs.backend_image_ref }}"
          docker pull "${{ inputs.frontend_image_ref }}"

      - name: Resolve smoke image references
        id: image_refs
        run: |
          if [ "${{ inputs.image_source }}" = "published" ]; then
            echo "backend=${{ inputs.backend_image_ref }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ inputs.frontend_image_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${BACKEND_LOCAL_TAG}" >> "$GITHUB_OUTPUT"
            echo "frontend=${FRONTEND_LOCAL_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create smoke network
        run: docker network create medassist-smoke

      - name: Verify backend shared runtime import
        run: |
          docker run --rm --entrypoint node "${{ steps.image_refs.outputs.backend }}" \
            -e 'import("@medassist/shared").then(() => console.log("shared-import-ok")).catch((error) => { console.error(error); process.exit(1); })'

      - name: Start backend container and verify health
        run: |
          DATA_VOLUME="medassist-backend-smoke-data-${GITHUB_RUN_ID}"
          echo "SMOKE_DATA_VOLUME=$DATA_VOLUME" >> "$GITHUB_ENV"
          docker volume create "$DATA_VOLUME" >/dev/null

          docker run -d \
            --name medassist-backend-smoke \
            --network medassist-smoke \
            -p 127.0.0.1:38080:3000 \
            -v "$DATA_VOLUME:/app/data" \
            -e ALLOW_UNAUTHENTICATED=true \
            -e DATA_DIR=/app/data \
            -e LOG_LEVEL=warn \
            "${{ steps.image_refs.outputs.backend }}"

          for _ in $(seq 1 30); do
            container_status="$(docker inspect --format '{{.State.Status}}' medassist-backend-smoke 2>/dev/null || echo missing)"
            if [ "$container_status" != "running" ]; then
              echo "Backend smoke container stopped before health became ready (status: $container_status)."
              docker inspect --format 'exit={{.State.ExitCode}} error={{.State.Error}}' medassist-backend-smoke 2>/dev/null || true
              docker logs medassist-backend-smoke 2>/dev/null || true
              exit 1
            fi

            if curl --fail --silent --show-error http://127.0.0.1:38080/health > smoke-logs/backend-health.json; then
              grep -F '"status":"ok"' smoke-logs/backend-health.json >/dev/null
              exit 0
            fi
            sleep 2
          done

          echo "Backend health check did not become ready in time."
          docker inspect --format 'exit={{.State.ExitCode}} error={{.State.Error}}' medassist-backend-smoke 2>/dev/null || true
          docker logs medassist-backend-smoke 2>/dev/null || true
          exit 1

      - name: Start frontend container and verify static assets and backend proxy
        run: |
          docker run -d \
            --name medassist-frontend-smoke \
            --network medassist-smoke \
            -p 127.0.0.1:38081:8080 \
            -e BACKEND_URL=medassist-backend-smoke:3000 \
            -e LOG_LEVEL=warn \
            "${{ steps.image_refs.outputs.frontend }}"

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:38081/ > smoke-logs/frontend-index.html; then
              grep -F '<div id="root"></div>' smoke-logs/frontend-index.html >/dev/null
              break
            fi
            sleep 2
            if [ "$attempt" -eq 20 ]; then
              echo "Frontend index did not become ready in time."
              exit 1
            fi
          done

          asset_path="$(grep -o '/assets/[^"]*' smoke-logs/frontend-index.html | head -1)"
          if [ -z "$asset_path" ]; then
            echo "Could not find a built frontend asset reference in the served index.html."
            exit 1
          fi

          curl --fail --silent --show-error "http://127.0.0.1:38081${asset_path}" > smoke-logs/frontend-asset.bin
          curl --fail --silent --show-error http://127.0.0.1:38081/api/health > smoke-logs/frontend-api-health.json
          grep -F '"status":"ok"' smoke-logs/frontend-api-health.json >/dev/null

      - name: Collect smoke diagnostics
        if: always()
        run: |
          docker ps -a > smoke-logs/docker-ps.txt || true
          docker logs medassist-backend-smoke > smoke-logs/backend.log 2>&1 || true
          docker logs medassist-frontend-smoke > smoke-logs/frontend.log 2>&1 || true
          docker inspect medassist-backend-smoke > smoke-logs/backend-inspect.json 2>/dev/null || true
          docker inspect medassist-frontend-smoke > smoke-logs/frontend-inspect.json 2>/dev/null || true

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: container-smoke-logs
          path: smoke-logs/
          retention-days: 7

      - name: Cleanup smoke resources
        if: always()
        run: |
          docker rm -f medassist-backend-smoke >/dev/null 2>&1 || true
          docker rm -f medassist-frontend-smoke >/dev/null 2>&1 || true
          docker network rm medassist-smoke >/dev/null 2>&1 || true
          docker volume rm -f "${SMOKE_DATA_VOLUME:-}" >/dev/null 2>&1 || true
