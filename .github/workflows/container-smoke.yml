name: Container Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'package*.json'
      - 'backend/package*.json'
      - 'frontend/package*.json'
      - 'shared/package*.json'
      - 'docker-compose*.yml'
      - '.github/workflows/docker-build.yml'
      - '.github/workflows/container-smoke.yml'
  workflow_call:
    inputs:
      image_source:
        description: 'build locally for PRs or smoke already-published images'
        required: false
        type: string
        default: build
      backend_image_ref:
        description: 'Published backend image reference when image_source=published'
        required: false
        type: string
        default: ''
      frontend_image_ref:
        description: 'Published frontend image reference when image_source=published'
        required: false
        type: string
        default: ''

concurrency:
  group: container-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      BACKEND_LOCAL_TAG: medassist-ng-backend-smoke:${{ github.sha }}
      FRONTEND_LOCAL_TAG: medassist-ng-frontend-smoke:${{ github.sha }}

    steps:
      - name: Checkout repository
        if: github.event_name != 'workflow_call' || inputs.image_source != 'published'
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        if: github.event_name != 'workflow_call' || inputs.image_source != 'published'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name == 'workflow_call' && inputs.image_source == 'published'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate published image references
        if: github.event_name == 'workflow_call' && inputs.image_source == 'published'
        run: |
          if [ -z "${{ inputs.backend_image_ref }}" ] || [ -z "${{ inputs.frontend_image_ref }}" ]; then
            echo "Published smoke mode requires both backend_image_ref and frontend_image_ref."
            exit 1
          fi

      - name: Prepare smoke artifact directory
        run: mkdir -p smoke-logs

      - name: Build backend image for local smoke
        if: github.event_name != 'workflow_call' || inputs.image_source != 'published'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          load: true
          tags: ${{ env.BACKEND_LOCAL_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build frontend image for local smoke
        if: github.event_name != 'workflow_call' || inputs.image_source != 'published'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          load: true
          tags: ${{ env.FRONTEND_LOCAL_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Pull published images
        if: github.event_name == 'workflow_call' && inputs.image_source == 'published'
        run: |
          docker pull "${{ inputs.backend_image_ref }}"
          docker pull "${{ inputs.frontend_image_ref }}"

      - name: Resolve smoke image references
        id: image_refs
        run: |
          if [ "${{ github.event_name }}" = "workflow_call" ] && [ "${{ inputs.image_source }}" = "published" ]; then
            echo "backend=${{ inputs.backend_image_ref }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ inputs.frontend_image_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${BACKEND_LOCAL_TAG}" >> "$GITHUB_OUTPUT"
            echo "frontend=${FRONTEND_LOCAL_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create smoke network
        run: docker network create medassist-smoke

      - name: Verify backend shared runtime import
        run: |
          docker run --rm --entrypoint node "${{ steps.image_refs.outputs.backend }}" \
            -e 'import("@medassist/shared").then(() => console.log("shared-import-ok")).catch((error) => { console.error(error); process.exit(1); })'

      - name: Start backend container and verify health
        run: |
          DATA_VOLUME="medassist-backend-smoke-data-${GITHUB_RUN_ID}"
          echo "SMOKE_DATA_VOLUME=$DATA_VOLUME" >> "$GITHUB_ENV"
          docker volume create "$DATA_VOLUME" >/dev/null

          docker run -d \
            --name medassist-backend-smoke \
            --network medassist-smoke \
            -p 127.0.0.1:38080:3000 \
            -v "$DATA_VOLUME:/app/data" \
            -e ALLOW_UNAUTHENTICATED=true \
            -e DATA_DIR=/app/data \
            -e LOG_LEVEL=warn \
            "${{ steps.image_refs.outputs.backend }}"

          for _ in $(seq 1 30); do
            container_status="$(docker inspect --format '{{.State.Status}}' medassist-backend-smoke 2>/dev/null || echo missing)"
            if [ "$container_status" != "running" ]; then
              echo "Backend smoke container stopped before health became ready (status: $container_status)."
              docker inspect --format 'exit={{.State.ExitCode}} error={{.State.Error}}' medassist-backend-smoke 2>/dev/null || true
              docker logs medassist-backend-smoke 2>/dev/null || true
              exit 1
            fi

            if curl --fail --silent --show-error http://127.0.0.1:38080/health > smoke-logs/backend-health.json; then
              grep -F '"status":"ok"' smoke-logs/backend-health.json >/dev/null
              exit 0
            fi
            sleep 2
          done

          echo "Backend health check did not become ready in time."
          docker inspect --format 'exit={{.State.ExitCode}} error={{.State.Error}}' medassist-backend-smoke 2>/dev/null || true
          docker logs medassist-backend-smoke 2>/dev/null || true
          exit 1

      - name: Start frontend container and verify static assets and backend proxy
        run: |
          docker run -d \
            --name medassist-frontend-smoke \
            --network medassist-smoke \
            -p 127.0.0.1:38081:8080 \
            -e BACKEND_URL=medassist-backend-smoke:3000 \
            -e LOG_LEVEL=warn \
            "${{ steps.image_refs.outputs.frontend }}"

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:38081/ > smoke-logs/frontend-index.html; then
              grep -F '<div id="root"></div>' smoke-logs/frontend-index.html >/dev/null
              break
            fi
            sleep 2
            if [ "$attempt" -eq 20 ]; then
              echo "Frontend index did not become ready in time."
              exit 1
            fi
          done

          asset_path="$(grep -o '/assets/[^"]*' smoke-logs/frontend-index.html | head -1)"
          if [ -z "$asset_path" ]; then
            echo "Could not find a built frontend asset reference in the served index.html."
            exit 1
          fi

          curl --fail --silent --show-error "http://127.0.0.1:38081${asset_path}" > smoke-logs/frontend-asset.bin
          curl --fail --silent --show-error http://127.0.0.1:38081/api/health > smoke-logs/frontend-api-health.json
          grep -F '"status":"ok"' smoke-logs/frontend-api-health.json >/dev/null

      - name: Collect smoke diagnostics
        if: always()
        run: |
          docker ps -a > smoke-logs/docker-ps.txt || true
          docker logs medassist-backend-smoke > smoke-logs/backend.log 2>&1 || true
          docker logs medassist-frontend-smoke > smoke-logs/frontend.log 2>&1 || true
          docker inspect medassist-backend-smoke > smoke-logs/backend-inspect.json 2>/dev/null || true
          docker inspect medassist-frontend-smoke > smoke-logs/frontend-inspect.json 2>/dev/null || true

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: container-smoke-logs
          path: smoke-logs/
          retention-days: 7

      - name: Cleanup smoke resources
        if: always()
        run: |
          docker rm -f medassist-backend-smoke >/dev/null 2>&1 || true
          docker rm -f medassist-frontend-smoke >/dev/null 2>&1 || true
          docker network rm medassist-smoke >/dev/null 2>&1 || true
          docker volume rm -f "${SMOKE_DATA_VOLUME:-}" >/dev/null 2>&1 || true
