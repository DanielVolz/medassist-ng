name: E2E Tests

on:
  workflow_call:
    inputs:
      upstream_success:
        required: false
        type: boolean
        default: true
      selection_mode:
        required: false
        type: string
        default: pull_request
      groups:
        required: false
        type: string
        default: full
  workflow_dispatch:
    inputs:
      groups:
        description: "Comma-separated groups: full, core-a, core-b, medication-data, planning-data, ui, performance"
        required: true
        default: full
        type: string
  schedule:
    - cron: "23 3 * * 0"

permissions:
  contents: read

jobs:
  selection:
    name: Select Playwright coverage
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.select.outputs.groups }}
      matrix_groups: ${{ steps.select.outputs.matrix_groups }}
      ui_selected: ${{ steps.select.outputs.ui_selected }}
      reason: ${{ steps.select.outputs.reason }}
      target_sha: ${{ steps.select.outputs.target_sha }}
    steps:
      - name: Require manual selection from the default branch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the manual E2E workflow from the default branch (main)."
          exit 1

      - name: Checkout exact PR merge commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout trusted default branch for scheduled and manual runs
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Select deterministic browser groups
        id: select
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SELECTION_MODE: ${{ inputs.selection_mode || github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          TARGET_REF: ${{ github.ref }}
          TARGET_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPSTREAM_SUCCESS: ${{ inputs.upstream_success }}
          MANUAL_GROUPS: ${{ inputs.groups }}
        run: node .github/scripts/select-e2e.mjs

  playwright-standard:
    name: Playwright E2E (${{ matrix.group }})
    needs: selection
    if: needs.selection.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      PLAYWRIGHT_WORKERS: 1
      PLAYWRIGHT_HTML_OPEN: never
      JWT_SECRET: e2e-test-secret-that-is-long-enough
      SESSION_SECRET: e2e-test-session-secret-long-enough
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.selection.outputs.matrix_groups || '["none"]') }}
    permissions:
      contents: read
    steps:
      - name: Report no standard groups selected
        if: matrix.group == 'none'
        run: echo "No standard Playwright group selected; see the selection job for the auditable reason."

      - name: Checkout exact PR target
        if: matrix.group != 'none' && github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Checkout trusted default branch for scheduled and manual runs
        if: matrix.group != 'none' && github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        if: matrix.group != 'none'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install shared dependencies and build contracts
        if: matrix.group != 'none'
        run: npm ci --prefix shared && npm run build --prefix shared

      - name: Install backend and frontend dependencies
        if: matrix.group != 'none'
        run: npm ci --prefix backend && npm ci --prefix frontend

      - name: Install Playwright Chromium
        if: matrix.group != 'none'
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run selected Playwright group
        if: matrix.group != 'none'
        working-directory: frontend
        run: node ../.github/scripts/run-e2e-group.mjs
        env:
          E2E_GROUP: ${{ matrix.group }}

      - name: Upload Playwright report
        if: always() && matrix.group != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.group }}-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright results
        if: always() && matrix.group != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.group }}-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  playwright-ui:
    name: Playwright E2E editor UI
    needs: selection
    if: needs.selection.result == 'success' && needs.selection.outputs.ui_selected == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --platform linux/amd64
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR target
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Checkout trusted default branch for scheduled and manual runs
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install shared dependencies and build contracts
        run: npm ci --prefix shared && npm run build --prefix shared

      - name: Install backend and frontend dependencies
        run: npm ci --prefix backend && npm ci --prefix frontend

      - name: Run medication UI functional and accessibility checks
        working-directory: frontend
        run: node ../.github/scripts/run-e2e-group.mjs
        env:
          CI: true
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_WORKERS: 1
          PLAYWRIGHT_AUTH_FILE: /tmp/medassist-ui-auth/user.json
          PLAYWRIGHT_DATA_DIR: /tmp/medassist-ui-e2e-data
          PLAYWRIGHT_OUTPUT_DIR: test-results/ui-e2e
          PLAYWRIGHT_UI_TESTS: true
          E2E_GROUP: ui

      - name: Upload sanitized medication UI failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: medication-ui-failure-evidence
          path: |
            frontend/test-results/ui-e2e/**/*.png
            frontend/test-results/ui-e2e/**/*.webm
            frontend/test-results/ui-e2e/**/ui-safe-diagnostics*.json
            frontend/test-results/ui-e2e/*/attachments/ui-safe-diagnostics-*.json
          if-no-files-found: ignore
          retention-days: 7

  e2e-summary:
    name: Playwright E2E Result
    if: always()
    needs: [selection, playwright-standard, playwright-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR target
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Checkout trusted default branch for scheduled and manual runs
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Preserve aggregate result and report selection
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          STANDARD_RESULT: ${{ needs.playwright-standard.result }}
          UI_RESULT: ${{ needs.playwright-ui.result }}
          GROUPS: ${{ needs.selection.outputs.groups }}
          UI_SELECTED: ${{ needs.selection.outputs.ui_selected }}
          REASON: ${{ needs.selection.outputs.reason }}
          TARGET_SHA: ${{ needs.selection.outputs.target_sha }}
        run: node .github/scripts/validate-e2e-result.mjs
