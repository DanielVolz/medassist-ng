name: E2E Tests

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

# Minimal permissions for security
permissions:
  actions: read
  contents: read

jobs:
  changes:
    name: Detect E2E relevance
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e_relevant: ${{ steps.filter.outputs.e2e_relevant }}
    steps:
      - id: filter
        run: echo "e2e_relevant=true" >> "$GITHUB_OUTPUT"

  e2e:
    name: Playwright E2E
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Skip E2E when change is not release/e2e-relevant
        if: needs.changes.outputs.e2e_relevant != 'true'
        run: echo "No E2E-relevant changes detected; required check passes without running Playwright."

      - name: Download tested source
        if: needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/download-artifact@v8
        with:
          name: e2e-source
          path: ${{ runner.temp }}/e2e-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Extract tested source
        if: needs.changes.outputs.e2e_relevant == 'true'
        run: tar -xzf "$RUNNER_TEMP/e2e-source/e2e-source.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Setup Node.js
        if: needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install shared dependencies
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: shared
        run: npm ci

      - name: Build shared core
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: shared
        run: npm run build

      - name: Install backend dependencies
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run domain E2E release gate
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: frontend
        run: npm run test:e2e:domain
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 1
          PLAYWRIGHT_HTML_OPEN: never
          JWT_SECRET: e2e-test-secret-that-is-long-enough
          SESSION_SECRET: e2e-test-session-secret-long-enough

      - name: Run core Chromium E2E tests
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: frontend
        run: npm run test:e2e:ci:core
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 1
          PLAYWRIGHT_HTML_OPEN: never
          JWT_SECRET: e2e-test-secret-that-is-long-enough
          SESSION_SECRET: e2e-test-session-secret-long-enough

      - name: Upload Playwright report
        if: always() && needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always() && needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

  e2e-data:
    name: Playwright E2E data
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Skip data E2E when change is not release/e2e-relevant
        if: needs.changes.outputs.e2e_relevant != 'true'
        run: echo "No E2E-relevant changes detected; required check passes without running Playwright data tests."

      - name: Download tested source
        if: needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/download-artifact@v8
        with:
          name: e2e-source
          path: ${{ runner.temp }}/e2e-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Extract tested source
        if: needs.changes.outputs.e2e_relevant == 'true'
        run: tar -xzf "$RUNNER_TEMP/e2e-source/e2e-source.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Setup Node.js
        if: needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install shared dependencies
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: shared
        run: npm ci

      - name: Build shared core
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: shared
        run: npm run build

      - name: Install backend dependencies
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run data-focused Chromium E2E tests
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: frontend
        run: npm run test:e2e:ci:data
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 1
          PLAYWRIGHT_HTML_OPEN: never
          JWT_SECRET: e2e-test-secret-that-is-long-enough
          SESSION_SECRET: e2e-test-session-secret-long-enough

      - name: Upload Playwright data report
        if: always() && needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-data-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload data test results
        if: always() && needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-data-results
          path: frontend/test-results/
          retention-days: 7
