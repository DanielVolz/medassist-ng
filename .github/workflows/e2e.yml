name: E2E Tests

on:
  workflow_call:
    inputs:
      run_e2e:
        required: false
        type: boolean
        default: false

# Minimal permissions for security
permissions:
  contents: read

jobs:
  changes:
    name: Detect E2E relevance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e_relevant: ${{ steps.filter.outputs.e2e_relevant }}
    steps:
      - id: filter
        run: echo "e2e_relevant=${{ inputs.run_e2e }}" >> "$GITHUB_OUTPUT"

  e2e-core:
    name: Playwright E2E core (${{ matrix.id }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: core-a
            script: test:e2e:ci:core:a
          - id: core-b
            script: test:e2e:ci:core:b
    permissions:
      contents: read

    steps:
      - name: Skip core E2E when change is not release/e2e-relevant
        if: needs.changes.outputs.e2e_relevant != 'true'
        run: echo "No E2E-relevant changes detected; required check passes without running Playwright."

      - name: Checkout repository
        if: needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install shared dependencies
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: shared
        run: npm ci

      - name: Build shared core
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: shared
        run: npm run build

      - name: Install backend dependencies
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run Chromium E2E core shard
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: frontend
        run: npm run ${{ matrix.script }}
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 1
          PLAYWRIGHT_HTML_OPEN: never
          JWT_SECRET: e2e-test-secret-that-is-long-enough
          SESSION_SECRET: e2e-test-session-secret-long-enough

      - name: Upload Playwright report
        if: always() && needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.id }}-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always() && needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.id }}-results
          path: frontend/test-results/
          retention-days: 7

  e2e-data:
    name: Playwright E2E data
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Skip data E2E when change is not release/e2e-relevant
        if: needs.changes.outputs.e2e_relevant != 'true'
        run: echo "No E2E-relevant changes detected; required check passes without running Playwright data tests."

      - name: Checkout repository
        if: needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install shared dependencies
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: shared
        run: npm ci

      - name: Build shared core
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: shared
        run: npm run build

      - name: Install backend dependencies
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run data-focused Chromium E2E tests
        if: needs.changes.outputs.e2e_relevant == 'true'
        working-directory: frontend
        run: npm run test:e2e:ci:data
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 1
          PLAYWRIGHT_HTML_OPEN: never
          JWT_SECRET: e2e-test-secret-that-is-long-enough
          SESSION_SECRET: e2e-test-session-secret-long-enough

      - name: Upload Playwright data report
        if: always() && needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-data-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload data test results
        if: always() && needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-data-results
          path: frontend/test-results/
          retention-days: 7

  e2e-ui:
    name: Playwright E2E medication UI
    needs: changes
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --platform linux/amd64
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        if: needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install shared dependencies and build contracts
        if: needs.changes.outputs.e2e_relevant == 'true'
        run: npm ci --prefix shared && npm run build --prefix shared

      - name: Install backend and frontend dependencies
        if: needs.changes.outputs.e2e_relevant == 'true'
        run: npm ci --prefix backend && npm ci --prefix frontend

      - name: Run dedicated medication UI regressions
        if: needs.changes.outputs.e2e_relevant == 'true'
        run: npm run test:e2e:ci:ui --prefix frontend
        env:
          CI: true
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_WORKERS: 1
          PLAYWRIGHT_AUTH_FILE: /tmp/medassist-ui-auth/user.json
          PLAYWRIGHT_DATA_DIR: /tmp/medassist-ui-e2e-data
          PLAYWRIGHT_OUTPUT_DIR: test-results/ui-e2e
          PLAYWRIGHT_UI_TESTS: true

      - name: Upload sanitized medication UI failure evidence
        if: always() && needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: medication-ui-failure-evidence
          path: |
            frontend/test-results/ui-e2e/**/*.png
            frontend/test-results/ui-e2e/**/*.webm
            frontend/test-results/ui-e2e/**/ui-safe-diagnostics*.json
            frontend/test-results/ui-e2e/*/attachments/ui-safe-diagnostics-*.json
          if-no-files-found: ignore
          retention-days: 7
