name: Move Done in Project

on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]

permissions: {}

jobs:
  move-to-done:
    name: Move to Done
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'issues' && github.event.issue.state_reason == 'completed') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    steps:
      - name: Move project item to Done
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            const projectUrl = process.env.PROJECT_URL;
            if (!projectUrl) {
              core.setFailed("Missing repository variable PROJECT_URL.");
              return;
            }

            const match = projectUrl.match(/^https:\/\/github\.com\/(?:users|orgs)\/([^/]+)\/projects\/(\d+)\/?$/);
            if (!match) {
              core.setFailed(`PROJECT_URL has an unsupported format: ${projectUrl}`);
              return;
            }

            const [, owner, projectNumberRaw] = match;
            const projectNumber = Number(projectNumberRaw);

            const projectResult = await github.graphql(`
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 50) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
                organization(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 50) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, { owner, number: projectNumber });

            const project = projectResult.user?.projectV2 || projectResult.organization?.projectV2;
            if (!project) {
              core.setFailed(`Project ${projectUrl} was not found or is not accessible to the project automation token.`);
              return;
            }

            const statusField = (project.fields?.nodes || []).find((field) => field.name === "Status");
            const doneOptionId = (statusField?.options || []).find((option) => option.name === "Done")?.id;

            if (!statusField || !doneOptionId) {
              core.setFailed('Configured project is missing the single-select "Status" field or its "Done" option.');
              return;
            }

            // Determine content ID (issue or PR node ID)
            const nodeId = context.payload.issue?.node_id || context.payload.pull_request?.node_id;
            const number = context.payload.issue?.number || context.payload.pull_request?.number;
            const type = context.payload.issue ? 'issue' : 'pull_request';

            console.log(`Processing ${type} #${number} (${nodeId})`);

            // Find the project item by content node ID
            const result = await github.graphql(`
              query($nodeId: ID!) {
                node(id: $nodeId) {
                  ... on Issue {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id }
                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            name
                            optionId
                          }
                        }
                      }
                    }
                  }
                  ... on PullRequest {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id }
                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            name
                            optionId
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, { nodeId });

            const items = result.node?.projectItems?.nodes || [];
            const projectItem = items.find(item => item.project.id === project.id);

            if (!projectItem) {
              console.log(`${type} #${number} is not in the project board — skipping.`);
              return;
            }

            const currentStatus = projectItem.fieldValueByName?.name || 'unknown';
            if (currentStatus === 'Done') {
              console.log(`${type} #${number} is already "Done" — skipping.`);
              return;
            }

            console.log(`Moving ${type} #${number} from "${currentStatus}" to "Done"...`);

            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `, {
              projectId: project.id,
              itemId: projectItem.id,
              fieldId: statusField.id,
              optionId: doneOptionId
            });

            console.log(`Successfully moved ${type} #${number} to "Done".`);
        env:
          PROJECT_URL: ${{ vars.PROJECT_URL }}
