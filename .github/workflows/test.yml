name: Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'package.json'
      - 'release-policy.json'
      - 'scripts/**'
      - 'biome.json'

# Minimal permissions for security
permissions:
  contents: read

jobs:
  # =============================================================================
  # Detect which paths changed to skip unnecessary jobs
  # =============================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'shared/**'
              - 'package.json'
              - 'release-policy.json'
              - 'scripts/**'
              - 'biome.json'
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - 'package.json'
              - 'release-policy.json'
              - 'scripts/**'
              - 'biome.json'

  # =============================================================================
  # Backend Tests (always emits the required check context)
  # =============================================================================
  backend-test:
    name: Backend Tests
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Skip backend checks when change is not backend-relevant
        if: needs.changes.outputs.backend != 'true'
        working-directory: .
        run: echo "No backend-relevant changes detected; required check passes without running backend validations."

      - name: Checkout repository
        if: needs.changes.outputs.backend == 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json

      - name: Install shared dependencies
        if: needs.changes.outputs.backend == 'true'
        working-directory: shared
        run: npm ci

      - name: Build shared core
        if: needs.changes.outputs.backend == 'true'
        working-directory: shared
        run: npm run build

      - name: Install dependencies
        if: needs.changes.outputs.backend == 'true'
        run: npm ci

      - name: Lint
        if: needs.changes.outputs.backend == 'true'
        run: npm run lint

      - name: TypeScript type check
        if: needs.changes.outputs.backend == 'true'
        run: npx tsc --noEmit

      - name: Run domain safety release gate
        if: needs.changes.outputs.backend == 'true'
        run: npm run test:domain

      - name: Run tests with coverage
        if: needs.changes.outputs.backend == 'true'
        run: npm run test:coverage

      - name: Upload coverage report
        if: always() && needs.changes.outputs.backend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # =============================================================================
  # Frontend Tests & Build (always emits the required check context)
  # =============================================================================
  frontend-build:
    name: Frontend Build
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Skip frontend checks when change is not frontend-relevant
        if: needs.changes.outputs.frontend != 'true'
        working-directory: .
        run: echo "No frontend-relevant changes detected; required check passes without running frontend validations."

      - name: Checkout repository
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            frontend/package-lock.json

      - name: Install shared dependencies
        if: needs.changes.outputs.frontend == 'true'
        working-directory: shared
        run: npm ci

      - name: Build shared core
        if: needs.changes.outputs.frontend == 'true'
        working-directory: shared
        run: npm run build

      - name: Install dependencies
        if: needs.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Lint
        if: needs.changes.outputs.frontend == 'true'
        run: npm run lint

      - name: Run tests with coverage
        if: needs.changes.outputs.frontend == 'true'
        run: npm run test:coverage

      - name: TypeScript type check & build
        if: needs.changes.outputs.frontend == 'true'
        run: npm run build

      - name: Upload coverage report
        if: always() && needs.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
