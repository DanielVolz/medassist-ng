services:
  backend:
    image: git.danielvolz.org/daniel/medassist/backend:0.0.1
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
    ports:
      - "4000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: git.danielvolz.org/daniel/medassist/frontend:0.0.1
    ports:
      - "4174:80"
    depends_on:
      - backend
