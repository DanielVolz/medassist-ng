services:
  backend:
    image: medassist-backend:latest
    build:
      context: ./backend
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: medassist-frontend:latest
    build:
      context: ./frontend
    ports:
      - "4173:80"
    depends_on:
      - backend
